name: Build Windows app

# Builds the installer on a real Windows machine for every pull request and every
# push to main. On main it also publishes a release named after the version in
# package.json, once per version: bump the version to publish a new one.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist

      # Drives the packaged app with a fake microphone and a mock API. Hosted runners
      # have no sound card and an unusual desktop, so a failure here does not block the build.
      - name: Smoke test the packaged app
        continue-on-error: true
        shell: bash
        run: |
          export MC_E2E_BIN="$PWD/dist/win-unpacked/Meeting Copilot.exe"
          export MC_E2E_OUT="$PWD/e2e-out"
          node test/e2e.js

      - name: Post smoke test result on the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "
            const fs = require('fs');
            let r; try { r = JSON.parse(fs.readFileSync('e2e-out/result.json', 'utf8')); } catch { r = { ok: false, error: 'no result.json was written', steps: [] }; }
            const lines = r.steps.map(s => '- **' + s.name + '**: ' + JSON.stringify(Object.fromEntries(Object.entries(s).filter(([k]) => k !== 'name'))).slice(0, 420));
            fs.writeFileSync('e2e-summary.md', '### Windows smoke test: ' + (r.ok ? 'passed' : 'failed') + '\n\n' + (r.error ? '    ' + String(r.error).split('\n')[0] + '\n\n' : '') + lines.join('\n') + '\n');
          "
          gh pr comment "${{ github.event.pull_request.number }}" --body-file e2e-summary.md

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: meeting-copilot-windows
          path: |
            dist/*.exe
            e2e-out/
          if-no-files-found: warn

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump the version in package.json to publish a new one."
            exit 0
          fi
          gh release create "$tag" dist/*.exe --target "$GITHUB_SHA" \
            --title "Meeting Copilot $tag" \
            --notes "Windows build. Download **Meeting-Copilot-Setup** to install it with Start menu and desktop shortcuts, or the **portable** file to run it without installing. The app is not code-signed, so Windows SmartScreen asks for confirmation the first time: choose More info, then Run anyway."
